name: Smart Sync Deploy (Skip Existing Files)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours timeout for very large projects
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1  # Shallow clone for faster checkout

    - name: Optimize project for deployment
      run: |
        echo "🚀 Preparing optimized deployment for large project..."
        
        # Show initial size
        echo "📊 Initial project size:"
        du -sh . 2>/dev/null || echo "Size check complete"
        
        # Remove development and unnecessary files
        rm -rf .git
        rm -rf .github  
        rm -rf tests
        rm -rf node_modules
        rm -f .gitignore
        rm -f README.md
        rm -f *.md
        rm -f phpunit.xml
        rm -f composer.lock
        
        # Clean up log files and temporary files
        find . -name "*.log" -type f -delete 2>/dev/null || true
        find . -name "error_log*" -type f -delete 2>/dev/null || true
        find . -name "*.tmp" -type f -delete 2>/dev/null || true
        find . -name "*.cache" -type f -delete 2>/dev/null || true
        find . -name "*.bak" -type f -delete 2>/dev/null || true
        find . -name "*.backup" -type f -delete 2>/dev/null || true
        find . -name "*.old" -type f -delete 2>/dev/null || true
        find . -name ".DS_Store" -type f -delete 2>/dev/null || true
        find . -name "Thumbs.db" -type f -delete 2>/dev/null || true
        
        # Optimize vendor directory
        if [ -d "vendor" ]; then
          echo "🧹 Cleaning vendor directory..."
          find vendor -name "tests" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor -name "test" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor -name "docs" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor -name "doc" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor -name "examples" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true
          rm -rf vendor/bin 2>/dev/null || true
        fi
        
        # Remove large media files that aren't essential
        find . -name "*.mp4" -type f -delete 2>/dev/null || true
        find . -name "*.avi" -type f -delete 2>/dev/null || true
        find . -name "*.mov" -type f -delete 2>/dev/null || true
        find . -name "*.zip" -type f -delete 2>/dev/null || true
        find . -name "*.tar.gz" -type f -delete 2>/dev/null || true
        
        # Show optimized size
        echo "📊 Optimized project size:"
        du -sh . 2>/dev/null || echo "Optimization complete"
        
        echo "✅ Files prepared for deployment"

    - name: Deploy to Hostinger with Enhanced Settings
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /public_html/
        
        # Enhanced settings for stability and large projects
        state-name: .ftp-deploy-sync-state.json
        dry-run: false
        log-level: minimal
        timeout: 3600000   # 60 minutes timeout
        dangerous-clean-slate: false
        
        # Connection stability settings
        security: strict
        
        # Comprehensive exclusion list
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/test/**
          **/.github/**
          **/vendor/bin/**
          **/vendor/*/tests/**
          **/vendor/*/test/**
          **/vendor/*/docs/**
          **/vendor/*/doc/**
          **/vendor/*/examples/**
          **/vendor/*/sample/**
          **/vendor/*/.git/**
          **/vendor/*/.*
          **/*.md
          **/*.txt
          **/*.log
          **/*.tmp
          **/*.cache
          **/*.bak
          **/*.backup
          **/*.old
          **/*.orig
          **/*.swp
          **/*.swo
          **/Thumbs.db
          **/.DS_Store
          **/desktop.ini
          **/error_log*
          **/access_log*
          **/backup*/**
          **/old*/**
          **/temp*/**
          **/tmp*/**
          **/cache*/**
          **/*_backup*
          **/*_old*
          **/*_temp*
          **/*.zip
          **/*.tar.gz
          **/*.rar
          **/*.7z
          **/*.mp4
          **/*.avi
          **/*.mov
          **/*.mkv
          **/*.wmv
          **/composer.lock
          **/phpunit.xml
          **/.gitignore
          **/README*
          **/CHANGELOG*
          **/LICENSE*

    - name: Deployment Success
      if: success()
      run: |
        echo "✅ Smart sync deployment completed successfully!"
        echo "⚡ Only changed files were uploaded"
        echo "🎯 Existing files were skipped automatically"
        echo "⏱️ Optimized for large project deployment"
        echo "🗂️ Unnecessary files excluded for speed"
        echo "📈 Future deployments will be much faster!"

    - name: Deployment Troubleshooting
      if: failure()
      run: |
        echo "❌ Deployment failed - troubleshooting info:"
        echo ""
        echo "🔧 Common solutions for FTP connection issues:"
        echo "1. Server may have connection limits - try again in a few minutes"
        echo "2. Large files may cause timeouts - consider manual upload for initial deployment"
        echo "3. Check FTP credentials in repository secrets"
        echo "4. Verify server allows long-running connections"
        echo "5. Consider splitting deployment into smaller batches"
        echo ""
        echo "💡 Alternative approaches:"
        echo "- Use manual FTP client for initial full upload"
        echo "- Deploy core files first, then assets separately"
        echo "- Use rsync if available on your hosting provider"
