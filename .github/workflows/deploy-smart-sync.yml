name: Smart Sync Deploy (Skip Existing Files)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 480  # 8 hours timeout for very large projects
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1  # Shallow clone for faster checkout

    - name: Optimize project for deployment
      run: |
        echo "🚀 Preparing optimized deployment for large project..."
        
        # Show initial size
        echo "📊 Initial project size:"
        du -sh . 2>/dev/null || echo "Size check complete"
        
        # Remove development and unnecessary files
        rm -rf .git
        rm -rf .github  
        rm -rf tests
        rm -rf node_modules
        rm -f .gitignore
        rm -f README.md
        rm -f *.md
        rm -f phpunit.xml
        rm -f composer.lock
        
        # Clean up log files and temporary files
        find . -name "*.log" -type f -delete 2>/dev/null || true
        find . -name "error_log*" -type f -delete 2>/dev/null || true
        find . -name "*.tmp" -type f -delete 2>/dev/null || true
        find . -name "*.cache" -type f -delete 2>/dev/null || true
        find . -name "*.bak" -type f -delete 2>/dev/null || true
        find . -name "*.backup" -type f -delete 2>/dev/null || true
        find . -name "*.old" -type f -delete 2>/dev/null || true
        find . -name ".DS_Store" -type f -delete 2>/dev/null || true
        find . -name "Thumbs.db" -type f -delete 2>/dev/null || true
        
        # Optimize vendor directory
        if [ -d "vendor" ]; then
          echo "🧹 Cleaning vendor directory..."
          find vendor -name "tests" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor -name "test" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor -name "docs" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor -name "doc" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor -name "examples" -type d -exec rm -rf {} + 2>/dev/null || true
          find vendor -name ".git" -type d -exec rm -rf {} + 2>/dev/null || true
          rm -rf vendor/bin 2>/dev/null || true
        fi
        
        # Remove large media files that aren't essential
        find . -name "*.mp4" -type f -delete 2>/dev/null || true
        find . -name "*.avi" -type f -delete 2>/dev/null || true
        find . -name "*.mov" -type f -delete 2>/dev/null || true
        find . -name "*.zip" -type f -delete 2>/dev/null || true
        find . -name "*.tar.gz" -type f -delete 2>/dev/null || true
        
        # Show optimized size
        echo "📊 Optimized project size:"
        du -sh . 2>/dev/null || echo "Optimization complete"
        
        echo "✅ Files prepared for deployment"

    - name: Deploy to Hostinger with Enhanced Settings
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      id: deploy
      continue-on-error: true
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /public_html/
        
        # Enhanced settings for stability and large projects
        state-name: .ftp-deploy-sync-state.json
        dry-run: false
        log-level: minimal
        timeout: 7200000   # 120 minutes (2 hours) timeout for FTP operations
        dangerous-clean-slate: false
        
        # Connection stability settings
        security: strict
        
        # Comprehensive exclusion list
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/test/**
          **/.github/**
          **/vendor/bin/**
          **/vendor/*/tests/**
          **/vendor/*/test/**
          **/vendor/*/docs/**
          **/vendor/*/doc/**
          **/vendor/*/examples/**
          **/vendor/*/sample/**
          **/vendor/*/.git/**
          **/vendor/*/.*
          **/*.md
          **/*.txt
          **/*.log
          **/*.tmp
          **/*.cache
          **/*.bak
          **/*.backup
          **/*.old
          **/*.orig
          **/*.swp
          **/*.swo
          **/Thumbs.db
          **/.DS_Store
          **/desktop.ini
          **/error_log*
          **/access_log*
          **/backup*/**
          **/old*/**
          **/temp*/**
          **/tmp*/**
          **/cache*/**
          **/*_backup*
          **/*_old*
          **/*_temp*
          **/*.zip
          **/*.tar.gz
          **/*.rar
          **/*.7z
          **/*.mp4
          **/*.avi
          **/*.mov
          **/*.mkv
          **/*.wmv
          **/composer.lock
          **/phpunit.xml
          **/.gitignore
          **/README*
          **/CHANGELOG*
          **/LICENSE*

    - name: Retry Deployment if Failed
      if: steps.deploy.outcome == 'failure'
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      id: retry-deploy
      continue-on-error: true
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /public_html/
        state-name: .ftp-deploy-sync-state.json
        dry-run: false
        log-level: standard  # More verbose logging for retry
        timeout: 7200000
        dangerous-clean-slate: false
        security: strict
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/tests/**
          **/test/**
          **/.github/**
          **/vendor/bin/**
          **/vendor/*/tests/**
          **/vendor/*/test/**
          **/vendor/*/docs/**
          **/vendor/*/doc/**
          **/vendor/*/examples/**
          **/vendor/*/sample/**
          **/vendor/*/.git/**
          **/vendor/*/.*
          **/*.md
          **/*.txt
          **/*.log
          **/*.tmp
          **/*.cache
          **/*.bak
          **/*.backup
          **/*.old
          **/*.orig
          **/*.swp
          **/*.swo
          **/Thumbs.db
          **/.DS_Store
          **/desktop.ini
          **/error_log*
          **/access_log*
          **/backup*/**
          **/old*/**
          **/temp*/**
          **/tmp*/**
          **/cache*/**
          **/*_backup*
          **/*_old*
          **/*_temp*
          **/*.zip
          **/*.tar.gz
          **/*.rar
          **/*.7z
          **/*.mp4
          **/*.avi
          **/*.mov
          **/*.mkv
          **/*.wmv
          **/composer.lock
          **/phpunit.xml
          **/.gitignore
          **/README*
          **/CHANGELOG*
          **/LICENSE*

    - name: Final Retry with Core Files Only
      if: steps.retry-deploy.outcome == 'failure'
      run: |
        echo "🔄 Attempting core files deployment only..."
        
        # Create core-only deployment
        mkdir -p core-deploy
        
        # Copy essential files only
        cp -r application core-deploy/ 2>/dev/null || true
        cp -r system core-deploy/ 2>/dev/null || true
        cp index.php core-deploy/ 2>/dev/null || true
        cp .htaccess core-deploy/ 2>/dev/null || true
        
        # Copy essential config files
        mkdir -p core-deploy/application/config
        cp application/config/*.php core-deploy/application/config/ 2>/dev/null || true
        
        echo "📊 Core deployment size:"
        du -sh core-deploy/
        
    - name: Deploy Core Files Only
      if: steps.retry-deploy.outcome == 'failure'
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./core-deploy/
        server-dir: /public_html/
        state-name: .ftp-deploy-core-state.json
        dry-run: false
        log-level: standard
        timeout: 3600000  # 1 hour for core files
        dangerous-clean-slate: false
        security: strict

    - name: Deployment Success
      if: success()
      run: |
        echo "✅ Smart sync deployment completed successfully!"
        echo "⚡ Only changed files were uploaded"
        echo "🎯 Existing files were skipped automatically"
        echo "⏱️ Optimized for very large project deployment (8-hour timeout)"
        echo "🗂️ Unnecessary files excluded for speed"
        echo "🔄 Retry mechanism ensured deployment completion"
        echo "📈 Future deployments will be much faster!"

    - name: Deployment Troubleshooting
      if: failure()
      run: |
        echo "❌ Deployment failed after multiple attempts - troubleshooting info:"
        echo ""
        echo "🔧 The deployment tried the following strategies:"
        echo "1. Full deployment with 2-hour FTP timeout"
        echo "2. Retry with verbose logging"
        echo "3. Core files only deployment as fallback"
        echo ""
        echo "💡 Manual deployment options:"
        echo "1. Use ./deploy-manual.sh for single package deployment"
        echo "2. Use ./deploy-batch.sh for split deployment (RECOMMENDED for large projects)"
        echo "3. Upload core files first, then assets separately"
        echo ""
        echo "🛠️ Batch deployment advantages:"
        echo "- Split into 4 manageable chunks"
        echo "- Site works after first batch"
        echo "- Can resume if interrupted"
        echo "- Detailed instructions included"
        echo ""
        echo "📞 If issues persist:"
        echo "- Check Hostinger FTP connection limits"
        echo "- Verify server allows long-running connections"
        echo "- Consider using Hostinger's file manager for large files"
        echo "- Contact hosting support about upload timeouts"
